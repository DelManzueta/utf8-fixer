<!doctype html>
<meta charset="utf-8" />
<title>UTF-8 Fixer</title>
<!-- <link rel="stylesheet" href="/ui/css/root.css" /> -->
<link rel="stylesheet" href="./css/root.css" />


<div class="panel">
    <h2>UTF-8 Document Fixer (CSV/XLSX) + JSON Comparator</h2>

    <div class="row">
        <label>Data files (.csv/.xlsx, ≤2MB each):</label>
        <input id="files" type="file" multiple accept=".csv,.xlsx" />
    </div>

    <div class="row">
        <label>Reference JSON (optional):</label>
        <input id="ref" type="file" accept=".json" />
    </div>

    <div class="row">
        <button id="btnUpload">Upload</button>
        <select id="exportFmt">
            <option value="csv">Export CSV</option>
            <option value="xlsx">Export XLSX</option>
        </select>
    </div>

    <div class="log" id="log"></div>
    <div id="filesArea"></div>
</div>

<script src="/ui/js/app.js"></script>
<script src="/ui/js/vendor/xlsx.full.min.js"></script>
<script src="/ui/js/vendor/FileSaver.min.js"></script>
<script src="/ui/js/vendor/papaparse.min.js"></script>

</body>

</html>
